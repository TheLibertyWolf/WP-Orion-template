name: CI
on:
  push:
  pull_request:
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: find assets -name '*.js' -print0 | xargs -0 -n1 node --check
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gettext zip
      - run: find languages -name '*.po' -print0 | xargs -0 -n1 msgfmt --check -o /dev/null
      - run: chmod +x bin/build-release.sh && bin/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: orion-26
          path: dist/*.zip
